name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate project files
        run: npm run check

      - name: Run domain and API tests
        run: npm test

      - name: Run AI pipeline smoke tests
        run: npm run test:ai

      - name: Run security tests
        run: npm run test:security

      - name: Run concurrent registration test
        run: npm run test:concurrency

      - name: Run API performance baseline
        run: npm run perf:baseline
        env:
          PERF_DURATION_SECONDS: "5"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
